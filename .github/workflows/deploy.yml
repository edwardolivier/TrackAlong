name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - "v2/**"
      - "v1/src/core/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: australia-southeast1
  SERVICE: trackalong-v2
  REGISTRY: australia-southeast1-docker.pkg.dev

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend deps
        working-directory: v2/frontend
        run: npm ci

      - name: Build frontend
        working-directory: v2/frontend
        run: npm run build

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build Docker image
        run: |
          docker build \
            -f v2/backend/Dockerfile \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/trackalong/${{ env.SERVICE }}:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/trackalong/${{ env.SERVICE }}:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/trackalong/${{ env.SERVICE }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/trackalong/${{ env.SERVICE }}:latest

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/trackalong/${{ env.SERVICE }}:${{ github.sha }}
          # Values are quoted because the action treats commas as delimiters, and an
          # argon2 hash contains commas (m=65536,t=3,p=4). Quoting preserves them.
          env_vars: |
            APP_USERNAME=${{ secrets.APP_USERNAME }}
            APP_PASSWORD_HASH="${{ secrets.APP_PASSWORD_HASH }}"
            SECRET_KEY="${{ secrets.SECRET_KEY }}"
            GCS_BUCKET=${{ secrets.GCS_BUCKET }}

      - name: Allow public access
        run: |
          gcloud run services add-iam-policy-binding trackalong-v2 \
            --region=australia-southeast1 \
            --member="allUsers" \
            --role="roles/run.invoker" \
            --project=${{ env.PROJECT_ID }}

      - name: Show service URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
