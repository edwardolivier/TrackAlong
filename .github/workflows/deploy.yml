name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "v2/**"
      - "v1/src/core/**"
      - ".github/workflows/deploy.yml"

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: australia-southeast1
  SERVICE: trackalong-v2
  REGISTRY: australia-southeast1-docker.pkg.dev

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for Workload Identity Federation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Google Auth (Workload Identity Federation — recommended) ────────────
      # See SETUP.md for how to configure the WIF provider and service account.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # ── Build React frontend ─────────────────────────────────────────────────
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: v2/frontend/package-lock.json

      - name: Install frontend deps
        working-directory: v2/frontend
        run: npm ci
        # Skipped gracefully if v2/frontend doesn't exist yet
        continue-on-error: true

      - name: Build frontend
        working-directory: v2/frontend
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        continue-on-error: true   # API still deploys even if frontend build missing

      # ── Build & push Docker image ────────────────────────────────────────────
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build Docker image
        run: |
          docker build \
            -f v2/backend/Dockerfile \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/trackalong/${{ env.SERVICE }}:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/trackalong/${{ env.SERVICE }}:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/trackalong/${{ env.SERVICE }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/trackalong/${{ env.SERVICE }}:latest

      # ── Deploy to Cloud Run ──────────────────────────────────────────────────
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/trackalong/${{ env.SERVICE }}:${{ github.sha }}
          env_vars: |
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            ALLOWED_EMAILS=${{ secrets.ALLOWED_EMAILS }}

      - name: Print service URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
